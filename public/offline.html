<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">

<title>JobFitwise – offline</title>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f5f3ee;color:#1a1a1a;font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;text-align:center;padding:24px}

<body>
<main>
  <img src="/icon-192.png" alt="">

  <button onclick="location.reload()">Försök igen / Try again</button>

</html>
